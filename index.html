<!doctype html>

<html lang="ko">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>하진이의 하루</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>

  <!-- -----------------------------------------
       Header
  ------------------------------------------ -->

  <header class="header">

    <div class="header-inner">

      <div>

        <h1 class="site-title">
          하진이의 하루
        </h1>

        <p class="site-subtitle">
          우리 가족의 성장앨범
        </p>

      </div>


      <div class="header-actions">

        <button
          id="uploadButton"
          class="icon-button"
          type="button"
          aria-label="사진 업로드"
          hidden
        >
          ＋
        </button>
      
      
        <button
          id="adminButton"
          class="icon-button"
          type="button"
          aria-label="관리자 로그인"
        >
          ⚙️
        </button>
      
      </div>

    </div>

  </header>


  <!-- -----------------------------------------
       Main
  ------------------------------------------ -->

  <main class="main">

  <!-- =========================================
       오늘
  ========================================== -->

  <section
    id="page-home"
    class="page active"
  >

    <div class="page-heading">

      <span class="section-label">
        TODAY
      </span>

      <h2>
        오늘의 하진 ❤️
      </h2>

      <p class="section-note">
        오늘 촬영한 사진과 영상
      </p>

    </div>


    <div
      id="todayGallery"
      class="gallery"
    ></div>


    <div class="home-block">

      <div class="section-heading">

        <div>

          <span class="section-label">
            RECENT
          </span>

          <h2>
            최근 기록
          </h2>

        </div>

      </div>


      <div
        id="recentGallery"
        class="gallery"
      ></div>

    </div>

  </section>



  <!-- =========================================
       이달
  ========================================== -->

  <section
    id="page-month"
    class="page"
  >

    <div class="page-heading">

      <span class="section-label">
        MONTH
      </span>

      <h2 id="monthPageTitle">
        이달의 하진
      </h2>

      <p class="section-note">
        촬영일을 기준으로 정리한 이번 달 기록
      </p>

    </div>


    <div id="monthGroups">
    </div>

  </section>



  <!-- =========================================
       베스트
  ========================================== -->

  <section
    id="page-best"
    class="page"
  >

    <div class="page-heading">

      <span class="section-label">
        BEST
      </span>

      <h2>
        베스트샷 🏆
      </h2>

      <p class="section-note">
        부모가 선택한 사진과 AI 추천 사진
      </p>

    </div>


    <div
      id="bestGallery"
      class="gallery"
    ></div>

  </section>



  <!-- =========================================
       전체
  ========================================== -->

  <section
    id="page-all"
    class="page"
  >

    <div class="page-heading">

      <span class="section-label">
        ALL
      </span>

      <h2>
        전체 기록
      </h2>

      <p class="section-note">
        촬영일 기준 월별 성장 기록
      </p>

    </div>


    <div id="allGroups">
    </div>

  </section>

</main>


  <!-- -----------------------------------------
       Bottom Navigation
  ------------------------------------------ -->

  <nav class="bottom-nav">

    <button
      class="nav-item active"
      data-page="home"
      type="button"
    >

      <span class="nav-icon">
        ❤️
      </span>

      <span>
        오늘
      </span>

    </button>


    <button
      class="nav-item"
      data-page="month"
      type="button"
    >

      <span class="nav-icon">
        📅
      </span>

      <span>
        이달
      </span>

    </button>


    <button
      class="nav-item"
      data-page="best"
      type="button"
    >

      <span class="nav-icon">
        🏆
      </span>

      <span>
        베스트
      </span>

    </button>


    <button
      class="nav-item"
      data-page="all"
      type="button"
    >

      <span class="nav-icon">
        🖼️
      </span>

      <span>
        전체
      </span>

    </button>

  </nav>

  <!-- -----------------------------------------
     Media Viewer
  ------------------------------------------ -->
  
  <div
    id="mediaViewer"
    class="media-viewer"
    aria-hidden="true"
  >
  
    <button
      id="viewerClose"
      class="viewer-close"
      type="button"
      aria-label="닫기"
    >
      ✕
    </button>
  
  
    <div
      id="viewerCounter"
      class="viewer-counter"
    >
    </div>
  
  
    <button
      id="viewerPrev"
      class="viewer-arrow viewer-prev"
      type="button"
      aria-label="이전 사진"
    >
      ‹
    </button>
  
  
    <div
      id="viewerContent"
      class="viewer-content"
    >
    </div>
  
  
    <button
      id="viewerNext"
      class="viewer-arrow viewer-next"
      type="button"
      aria-label="다음 사진"
    >
      ›
    </button>
  
  
    <div
      class="viewer-info"
    >
  
      <div
        id="viewerDate"
        class="viewer-date"
      >
      </div>
  
      <div
        id="viewerName"
        class="viewer-name"
      >
      </div>
  
    </div>
  
  </div>
  
  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>

</html>
