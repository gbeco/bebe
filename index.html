<!doctype html>

<html lang="ko">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>하진이의 하루</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>

  <!-- -----------------------------------------
       Header
  ------------------------------------------ -->

  <header class="header">

    <div class="header-inner">

      <div>

        <h1 class="site-title">
          하진이의 하루
        </h1>

        <p class="site-subtitle">
          우리 가족의 성장앨범
        </p>

      </div>


      <button
        id="adminButton"
        class="icon-button"
        type="button"
        aria-label="관리자 로그인"
      >
        ⚙️
      </button>

    </div>

  </header>


  <!-- -----------------------------------------
       Main
  ------------------------------------------ -->

  <main class="main">

    <!-- 오늘의 하진 -->

    <section
      id="todaySection"
      class="hero-section"
    >

      <div class="section-heading">

        <div>

          <span class="section-label">
            TODAY
          </span>

          <h2>
            오늘의 하진 ❤️
          </h2>

        </div>

      </div>


      <div class="hero-card">

        <div class="hero-placeholder">

          <span class="placeholder-icon">
            📷
          </span>

          <strong>
            오늘의 하진
          </strong>

          <p>
            Gemini가 오늘의 사진을
            골라줄 예정입니다.
          </p>

        </div>

      </div>

    </section>


    <!-- 이달의 하진 -->

    <section
      id="monthSection"
      class="content-section"
    >

      <div class="section-heading">

        <div>

          <span class="section-label">
            MONTH
          </span>

          <h2>
            이달의 하진
          </h2>

        </div>


        <button
          class="text-button"
          data-page="month"
          type="button"
        >
          전체보기
        </button>

      </div>


      <div
        id="monthPreview"
        class="preview-grid"
      >

        <div class="preview-placeholder">
          📷
        </div>

        <div class="preview-placeholder">
          📷
        </div>

        <div class="preview-placeholder">
          📷
        </div>

      </div>

    </section>


    <!-- 베스트샷 -->

    <section
      id="bestSection"
      class="content-section"
    >

      <div class="section-heading">

        <div>

          <span class="section-label">
            BEST
          </span>

          <h2>
            베스트샷
          </h2>

        </div>


        <button
          class="text-button"
          data-page="best"
          type="button"
        >
          전체보기
        </button>

      </div>


      <div class="best-card">

        <div class="hero-placeholder">

          <span class="placeholder-icon">
            🏆
          </span>

          <strong>
            베스트샷 보기
          </strong>

          <p>
            가족의 선택과 Gemini 추천을
            함께 반영합니다.
          </p>

        </div>

      </div>

    </section>


    <!-- 최근 사진 -->

    <section
      id="gallerySection"
      class="content-section"
    >

      <div class="section-heading">

        <div>

          <span class="section-label">
            RECENT
          </span>

          <h2>
            최근 사진
          </h2>

        </div>


        <button
          class="text-button"
          data-page="all"
          type="button"
        >
          전체보기
        </button>

      </div>


      <div
        id="gallery"
        class="gallery"
      >

        <div class="photo-placeholder">
          📷
        </div>

        <div class="photo-placeholder">
          📷
        </div>

        <div class="photo-placeholder">
          📷
        </div>

        <div class="photo-placeholder">
          📷
        </div>

        <div class="photo-placeholder">
          📷
        </div>

        <div class="photo-placeholder">
          📷
        </div>

      </div>

    </section>

  </main>


  <!-- -----------------------------------------
       Bottom Navigation
  ------------------------------------------ -->

  <nav class="bottom-nav">

    <button
      class="nav-item active"
      data-page="home"
      type="button"
    >

      <span class="nav-icon">
        ❤️
      </span>

      <span>
        오늘
      </span>

    </button>


    <button
      class="nav-item"
      data-page="month"
      type="button"
    >

      <span class="nav-icon">
        📅
      </span>

      <span>
        이달
      </span>

    </button>


    <button
      class="nav-item"
      data-page="best"
      type="button"
    >

      <span class="nav-icon">
        🏆
      </span>

      <span>
        베스트
      </span>

    </button>


    <button
      class="nav-item"
      data-page="all"
      type="button"
    >

      <span class="nav-icon">
        🖼️
      </span>

      <span>
        전체
      </span>

    </button>

  </nav>

  <!-- -----------------------------------------
     Media Viewer
  ------------------------------------------ -->
  
  <div
    id="mediaViewer"
    class="media-viewer"
    aria-hidden="true"
  >
  
    <button
      id="viewerClose"
      class="viewer-close"
      type="button"
      aria-label="닫기"
    >
      ✕
    </button>
  
  
    <div
      id="viewerCounter"
      class="viewer-counter"
    >
    </div>
  
  
    <button
      id="viewerPrev"
      class="viewer-arrow viewer-prev"
      type="button"
      aria-label="이전 사진"
    >
      ‹
    </button>
  
  
    <div
      id="viewerContent"
      class="viewer-content"
    >
    </div>
  
  
    <button
      id="viewerNext"
      class="viewer-arrow viewer-next"
      type="button"
      aria-label="다음 사진"
    >
      ›
    </button>
  
  
    <div
      class="viewer-info"
    >
  
      <div
        id="viewerDate"
        class="viewer-date"
      >
      </div>
  
      <div
        id="viewerName"
        class="viewer-name"
      >
      </div>
  
    </div>
  
  </div>
  
  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>

</html>
